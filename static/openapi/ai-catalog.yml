openapi: 3.1.0
info:
  title: AI Models Catalog API
  description: |
    Use your Client ID and Client Secret to request an access token. The three parameters (grant_type, client_id, client_secret) go in the request body as x-www-form-urlencoded; the only header is Content-Type.

    <pre>
    curl -X POST https://mylogin.aruba.it/auth/realms/cmp-new-apikey-ai/protocol/openid-connect/token \
    -H "Content-Type: application/x-www-form-urlencoded" \
    -d "grant_type=client_credentials" \
    -d "client_id=<YOUR_CLIENT_ID>" \
    -d "client_secret=<YOUR_CLIENT_SECRET>"
    </pre>

    The response contains the token in the access_token field and its lifetime in expires_in (seconds) ready to be used in the Authorize section. When it expires, request a new one.
  
  version: 1.1.0
servers:
- url: https://apiaruba.aruba.it/aiplatform
paths:
  /v1/models:
    get:
      tags:
        - Model Management
      summary: Models
      description: >-
        Provides basic information about each one such as the owner and
        availability.


        Follows the exact same API spec as `OpenAI's Chat API
        https://developers.openai.com/api/reference/resources/models/methods/list`
      operationId: model_list_v1_models_get
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '400':
          description: Bad request Error when passing an invalid or non-existing model name or an invalid enum or an invalid type in a field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
  /v1/chat/completions:
    post:
      tags:
        - Completions
      summary: Chat Completions
      description: >-
        Follows the exact same API spec as `OpenAI's Chat API
        https://platform.openai.com/docs/api-reference/chat`
      operationId: chat_completion_v1_chat_completions_post
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
            examples:
              Simple:
                $ref: '#/components/examples/ChatCompletions/Simple'
              Stream call (with usage):
                $ref: '#/components/examples/ChatCompletions/StreamCall'
              With logbprobs:
                $ref: '#/components/examples/ChatCompletions/WithLogprobs'
              All parameters:
                $ref: '#/components/examples/ChatCompletions/AllParams'
              All parameters (with tool call):
                $ref: '#/components/schemas/ChatCompletionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ChatCompletionStreamResponse'
              examples:
                Stream:
                  $ref: '#/components/examples/ChatCompletions/Stream'
        '400':
          description: Bad request Error when passing an invalid or non-existing model name or an invalid enum or an invalid type in a field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
  /v1/completions:
    post:
      tags:
        - Completions
      summary: Completions
      description: >-
        Follows the exact same API spec as `OpenAI's Completions API
        https://platform.openai.com/docs/api-reference/completions`
      operationId: completion_v1_completions_post
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletionRequest'
            examples:
              Simple:
                $ref: '#/components/examples/Completions/Simple'
              Stream call (with usage):
                $ref: '#/components/examples/Completions/StreamCall'
              All parameters:
                $ref: '#/components/schemas/CompletionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletionResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/CompletionStreamResponse'
              examples:
                Stream:
                  $ref: '#/components/examples/Completions/Stream'
        '400':
          description: Bad request Error when passing an invalid or non-existing model name or an invalid enum or an invalid type in a field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
  /v1/embeddings:
    post:
      tags:
        - Embeddings
      summary: Embeddings
      description: >-
        Follows the exact same API spec as `OpenAI's Embeddings API
        https://platform.openai.com/docs/api-reference/embeddings`
      operationId: embeddings_v1_embeddings_post
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingRequest'
            examples:
              Simple:
                $ref: '#/components/examples/Embeddings/Simple'
              Multiple inputs:
                $ref: '#/components/examples/Embeddings/MultipleInputs'
              Base64 encoding:
                $ref: '#/components/schemas/EmbeddingRequest'
              Float encoding:
                $ref: '#/components/examples/Embeddings/FloatEncoding'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingResponse'
              examples:
                Float encoding (default):
                  $ref: '#/components/schemas/EmbeddingResponse'
                Base64 encoding (default):
                  $ref: '#/components/examples/Responses/EmbeddingBase64Response'
        '400':
          description: Bad request Error when passing an invalid or non-existing model name or an invalid enum or an invalid type in a field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
  /v1/responses:
    post:
      tags:
        - Responses
      summary: Responses
      description: >-
        Follows the OpenAI Responses API spec:
        `https://platform.openai.com/docs/api-reference/responses`
      operationId: responses_api_v1_responses_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponsesRequest'
            examples:
              Simple:
                $ref: '#/components/examples/Responses/Simple'
              Stream call (with usage):
                $ref: '#/components/examples/Responses/StreamCall'
              All parameters:
                $ref: '#/components/examples/Responses/WithInstructionsAndReasoning'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsesResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ResponsesStreamResponse'
              examples:
                Stream:
                  $ref: '#/components/examples/Responses/Stream'
        '400':
          description: Bad request Error when passing an invalid or non-existing model name or an invalid enum or an invalid type in a field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
      security:
        - bearerAuth: []
  /v1/images/generations:
    post:
      tags:
        - Images Generations
      summary: Images Generations
      description: >-
        Follows the OpenAI Responses API spec:
        `https://developers.openai.com/api/reference/resources/images/methods/generate`
      operationId: images_api_v1_images_generations_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImagesGenerationsRequest'
            examples:
              Simple:
                $ref: '#/components/examples/ImagesGenerations/Simple'
              All parameters:
                $ref: '#/components/examples/ImagesGenerations/AllParams'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagesGenerationsResponse'
        '400':
          description: Bad request Error when passing an invalid or non-existing model name or an invalid enum or an invalid type in a field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
      security:
        - bearerAuth: []
  /v1/images/edits:
    post:
      tags:
        - Images Edits
      summary: Image Edits
      description: >-
        Follows the OpenAI Responses API spec:
        `https://developers.openai.com/api/reference/resources/images/methods/edit`
      operationId: images_api_v1_images_edits_post
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImagesEditsRequest'
            examples:
              Simple:
                $ref: '#/components/examples/ImagesEdits/Simple'
              All parameters:
                $ref: '#/components/examples/ImagesEdits/AllParams'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImagesEditsResponse'
        '400':
          description: Bad request Error when passing an invalid or non-existing model name or an invalid enum or an invalid type in a field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestError'
      security:
        - bearerAuth: []

components:
  schemas:
    ChatCompletionUserMessage:
      type: object
      title: User message
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - user
          description: The role of the message author
          examples:
            - user
        content:
          description: The contents of the message
          anyOf:
            - type: string
              description: The text contents of the message
              examples:
                - What is the capital of France?
            - type: array
              description: An array of content parts
              items:
                oneOf:
                  - type: object
                    title: Text content
                    required:
                      - type
                      - text
                    properties:
                      type:
                        type: string
                        enum:
                          - text
                        examples:
                          - text
                      text:
                        type: string
                        examples:
                          - What is shown in this image?
                  - type: object
                    title: Image content
                    required:
                      - type
                      - image_url
                    properties:
                      type:
                        type: string
                        enum:
                          - image_url
                        examples:
                          - image_url
                      image_url:
                        type: object
                        required:
                          - url
                        properties:
                          url:
                            type: string
                            description: >-
                              Either a URL of the image or the base64 encoded
                              image data
                            examples:
                              - https://example.com/images/photo.jpg
                          detail:
                            type: string
                            enum:
                              - auto
                              - low
                              - high
                            default: auto
                            examples:
                              - auto
        name:
          type: string
          description: An optional name for the participant
          examples:
            - john_doe
    ChatCompletionAssistantMessage:
      type: object
      title: Assistant message
      required:
        - role
      properties:
        role:
          type: string
          enum:
            - assistant
          description: The role of the message author
          examples:
            - assistant
        content:
          type: string
          nullable: true
          description: The contents of the message
          examples:
            - The capital of France is Paris.
        name:
          type: string
          description: An optional name for the participant
          examples:
            - assistant_1
        tool_calls:
          type: array
          description: The tool calls generated by the model
          items:
            type: object
            required:
              - id
              - type
              - function
            properties:
              id:
                type: string
                description: The ID of the tool call
                examples:
                  - call_abc123
              type:
                type: string
                enum:
                  - function
                description: The type of the tool
                examples:
                  - function
              function:
                type: object
                required:
                  - name
                  - arguments
                properties:
                  name:
                    type: string
                    description: The name of the function to call
                    examples:
                      - get_current_weather
                  arguments:
                    type: string
                    description: >-
                      The arguments to call the function with, as generated by
                      the model in JSON format
                    examples:
                      - '{"location": "Milan, IT", "unit": "celsius"}'
        function_call:
          type: object
          deprecated: true
          description: Deprecated and replaced by tool_calls
          required:
            - name
            - arguments
          properties:
            name:
              type: string
              description: The name of the function to call
              examples:
                - get_current_weather
            arguments:
              type: string
              description: The arguments to call the function with
              examples:
                - '{"location": "Milan, IT"}'
    ChatCompletionSystemMessage:
      type: object
      title: System message
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - system
          description: The role of the message author
          examples:
            - system
        content:
          type: string
          description: The contents of the system message
          examples:
            - You are a helpful assistant that answers concisely.
        name:
          type: string
          description: An optional name for the participant
          examples:
            - system_policy
    ChatCompletionToolMessage:
      type: object
      title: Tool message
      required:
        - role
        - content
        - tool_call_id
      properties:
        role:
          type: string
          enum:
            - tool
          description: The role of the message author
          examples:
            - tool
        content:
          type: string
          description: The contents of the tool message
          examples:
            - '{"temperature": 18, "unit": "celsius"}'
        tool_call_id:
          type: string
          description: The ID of the tool call that this message is responding to.
          examples:
            - call_abc123
    ChatCompletionFunctionMessage:
      type: object
      title: Function message
      deprecated: true
      required:
        - role
        - content
        - name
      properties:
        role:
          type: string
          enum:
            - function
          description: The role of the message author
          examples:
            - function
        content:
          type: string
          nullable: true
          description: The contents of the function message
          examples:
            - '{"temperature": 18, "unit": "celsius"}'
        name:
          type: string
          description: The name of the function to call
          examples:
            - get_current_weather
    ChatCompletionDeveloperMessage:
      type: object
      title: Developer message
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - developer
          description: The role of the message author
          examples:
            - developer
        content:
          type: string
          description: The contents of the developer message
          examples:
            - Always respond in valid JSON.
        name:
          type: string
          description: An optional name for the participant
          examples:
            - dev_notes
    ChatCompletionRequest:
      type: object
      required:
        - model
        - messages
      properties:
        model:
          type: string
          description: ID of the model to use
          examples:
            - gpt-oss-20b
        messages:
          type: array
          description: A list of messages comprising the conversation so far
          items:
            oneOf:
              - $ref: '#/components/schemas/ChatCompletionUserMessage'
              - $ref: '#/components/schemas/ChatCompletionAssistantMessage'
              - $ref: '#/components/schemas/ChatCompletionSystemMessage'
              - $ref: '#/components/schemas/ChatCompletionToolMessage'
              - $ref: '#/components/schemas/ChatCompletionFunctionMessage'
              - $ref: '#/components/schemas/ChatCompletionDeveloperMessage'
          examples:
            -   - role: system
                  content: You are a helpful assistant.
                - role: user
                  content: What is the weather like in the capital of France?
                - role: assistant
                  content:
                  tool_calls:
                    - id: call_abc123,
                      type: function,
                      function:
                        name: get_current_weather,
                        arguments:
                          location: Paris, France
                - role: tool
                  tool_call_id: call_abc123
                  content:
                    temp: 18
                    condition: cloudy
        frequency_penalty:
          type: number
          nullable: true
          minimum: -2
          maximum: 2
          default: 0
          description: >-
            Number between -2.0 and 2.0. Positive values penalize new tokens
            based on their existing frequency in the text so far
          examples:
            - 0
        logit_bias:
          type: object
          nullable: true
          additionalProperties:
            type: integer
          description: >-
            Modify the likelihood of specified tokens appearing in the
            completion
          examples:
            - "1": 0
              "2": 0
              "3": 0
        logprobs:
          type: boolean
          nullable: true
          default: false
          description: Whether to return log probabilities of the output tokens (must be paired with top_logprobs set and viceversa)
          examples:
            - true
        top_logprobs:
          type: integer
          nullable: true
          minimum: 0
          maximum: 20
          description: >-
            An integer between 0 and 20 specifying the number of most likely
            tokens to return at each token position (must be paired with logprobs set to true and viceversa)
          examples:
            - 5
        max_tokens:
          type: integer
          nullable: true
          default: 16
          description: >-
            The maximum number of tokens that can be generated in the chat
            completion
          examples:
            - 1024
        'n':
          type: integer
          nullable: true
          minimum: 1
          maximum: 128
          default: 1
          description: How many chat completion choices to generate for each input message
          examples:
            - 1
        presence_penalty:
          type: number
          nullable: true
          minimum: -2
          maximum: 2
          default: 0
          description: >-
            Number between -2.0 and 2.0. Positive values penalize new tokens
            based on whether they appear in the text so far
          examples:
            - 0
        response_format:
          type: object
          nullable: true
          properties:
            type:
              type: string
              enum:
                - text
                - json_object
                - json_schema
              description: The type of response format
              examples:
                - text
            json_schema:
              type: object
              description: The JSON schema for the response format
              properties:
                name:
                  type: string
                  examples:
                    - weather_response
                description:
                  type: string
                  examples:
                    - Schema describing the weather response payload
                schema:
                  type: object
                  examples:
                    - type: object
                      properties:
                        temperature:
                          type: number
                        unit:
                          type: string
                      required:
                        - temperature
                        - unit
                strict:
                  type: boolean
                  default: false
                  examples:
                    - true
          description: An object specifying the format that the model must output
          examples:
            - type: text
        seed:
          type: integer
          nullable: true
          description: >-
            If specified, our system will make a best effort to sample
            deterministically
          examples:
            - 42
        stop:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
              minItems: 1
              maxItems: 4
            - type: 'null'
          examples:
            - forbidden word
          description: Up to 4 sequences where the API will stop generating further tokens
        stream:
          type: boolean
          nullable: true
          default: false
          description: If set, partial message deltas will be sent
          examples:
            - false
        stream_options:
          type: object
          nullable: true
          properties:
            include_usage:
              type: boolean
              description: >-
                If set, an additional chunk will be streamed with usage
                statistics
              examples:
                - true
          description: Options for streaming response
          examples:
            - include_usage: true
        temperature:
          type: number
          nullable: true
          minimum: 0
          maximum: 2
          default: 1
          description: What sampling temperature to use, between 0 and 2
          examples:
            - 0.7
        top_p:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          default: 1
          description: An alternative to sampling with temperature, called nucleus sampling
          examples:
            - 1
        tools:
          type: array
          nullable: true
          items:
            type: object
            required:
              - type
              - function
            properties:
              type:
                type: string
                enum:
                  - function
                description: The type of the tool
                examples:
                  - function
              function:
                type: object
                required:
                  - name
                properties:
                  name:
                    type: string
                    description: The name of the function to be called
                    examples:
                      - get_current_weather
                  description:
                    type: string
                    description: A description of what the function does
                    examples:
                      - Get the current weather for a given location
                  parameters:
                    type: object
                    description: >-
                      The parameters the functions accepts, described as a JSON
                      Schema object
                    examples:
                      - type: object
                        properties:
                          location:
                            type: string
                            description: City and country, e.g. Milan, IT
                          unit:
                            type: string
                            enum:
                              - celsius
                              - fahrenheit
                        required:
                          - location
                  strict:
                    type: boolean
                    default: false
                    description: Whether to enable strict schema adherence
                    examples:
                      - true
          description: A list of tools the model may call
          examples:
            -   - type: function
                  function:
                    name: get_current_weather
                    description: Get the current weather for a given location
                    parameters:
                      type: object
                      properties:
                        location:
                          type: string
                      required:
                        - location
        tool_choice:
          oneOf:
            - type: string
              enum:
                - none
                - auto
                - required
              description: Controls which (if any) tool is called by the model
            - type: object
              required:
                - type
                - function
              properties:
                type:
                  type: string
                  enum:
                    - function
                  examples:
                    - function
                function:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      description: The name of the function to call
                      examples:
                        - get_current_weather
              description: Specifies a tool the model should use
            - type: 'null'
          description: Controls which (if any) tool is called by the model
          examples:
            - auto
        parallel_tool_calls:
          type: boolean
          nullable: true
          default: true
          description: Whether to enable parallel function calling during tool use
          examples:
            - true
        user:
          type: string
          nullable: true
          description: A unique identifier representing your end-user
          examples:
            - user-1234
    ChatCompletionResponse:
      type: object
      required:
        - id
        - object
        - created
        - model
        - choices
        - usage
      properties:
        id:
          type: string
          description: A unique identifier for the chat completion
          examples:
            - chatcmpl-8f9a3b1c2d
        object:
          type: string
          enum:
            - chat.completion
          description: The object type, which is always chat.completion
          examples:
            - chat.completion
        created:
          type: integer
          description: >-
            The Unix timestamp (in seconds) of when the chat completion was
            created
          examples:
            - 1717000000
        model:
          type: string
          description: The model used for the chat completion
          examples:
            - gpt-oss-20b
        choices:
          type: array
          description: A list of chat completion choices
          items:
            type: object
            required:
              - index
              - message
              - finish_reason
            properties:
              index:
                type: integer
                description: The index of the choice in the list of choices
                examples:
                  - 0
              message:
                $ref: '#/components/schemas/ChatCompletionAssistantMessage'
              logprobs:
                type: object
                nullable: true
                description: Log probability information for the choice
                examples:
                  - false
              finish_reason:
                type: string
                enum:
                  - stop
                  - length
                  - tool_calls
                  - content_filter
                  - function_call
                description: The reason the model stopped generating tokens
                examples:
                  - stop
          examples:
            - index: 0
              message:
                role: assistant
                content: The capital of France is Paris.
              logprobs:
              finish_reason: stop
        usage:
          type: object
          required:
            - prompt_tokens
            - completion_tokens
            - total_tokens
          properties:
            prompt_tokens:
              type: integer
              description: Number of tokens in the prompt
              examples:
                - 15
            completion_tokens:
              type: integer
              description: Number of tokens in the generated completion
              examples:
                - 8
            total_tokens:
              type: integer
              description: Total number of tokens used in the request
              examples:
                - 23
        system_fingerprint:
          type: string
          description: This fingerprint represents the backend configuration
          examples:
            - fp_44709d6fcb
    ChatCompletionStreamResponse:
      type: object
      description: >-
        Rappresenta un singolo chunk inviato durante lo streaming. Il campo
        message di ChatCompletionResponse è sostituito da delta, che contiene
        solo il frammento incrementale di contenuto generato in quel chunk.
      required:
        - id
        - object
        - created
        - model
        - choices
      properties:
        id:
          type: string
          description: A unique identifier for the chat completion
          examples:
            - chatcmpl-8f9a3b1c2d
        object:
          type: string
          enum:
            - chat.completion.chunk
          description: The object type, which is always chat.completion.chunk
          examples:
            - chat.completion.chunk
        created:
          type: integer
          description: >-
            The Unix timestamp (in seconds) of when the chat completion was
            created
          examples:
            - 1717000000
        model:
          type: string
          description: The model used for the chat completion
          examples:
            - gpt-oss-20b
        choices:
          type: array
          description: >-
            A list of chat completion choice deltas. Empty array in the final
            usage-only chunk when stream_options.include_usage is true.
          items:
            type: object
            required:
              - index
              - delta
            properties:
              index:
                type: integer
                description: The index of the choice in the list of choices
                examples:
                  - 0
              delta:
                $ref: '#/components/schemas/ChatCompletionStreamDelta'
              logprobs:
                type: object
                nullable: true
                description: Log probability information for the choice
                examples:
                  - false
              finish_reason:
                type: string
                nullable: true
                enum:
                  - stop
                  - length
                  - tool_calls
                  - content_filter
                  - function_call
                description: >-
                  The reason the model stopped generating tokens. Null in
                  every chunk except the last one for this choice.
                examples:
                  - null
          examples:
            - index: 0
              delta:
                role: assistant
                content: Paris
              logprobs:
              finish_reason:
        usage:
          type: object
          nullable: true
          description: >-
            Present only in the final chunk, and only if
            stream_options.include_usage was true in the request. In that
            chunk, choices is an empty array.
          required:
            - prompt_tokens
            - completion_tokens
            - total_tokens
          properties:
            prompt_tokens:
              type: integer
              description: Number of tokens in the prompt
              examples:
                - 15
            completion_tokens:
              type: integer
              description: Number of tokens in the generated completion
              examples:
                - 8
            total_tokens:
              type: integer
              description: Total number of tokens used in the request
              examples:
                - 23
        system_fingerprint:
          type: string
          description: This fingerprint represents the backend configuration
          examples:
            - fp_44709d6fcb
    ChatCompletionStreamDelta:
      type: object
      description: >-
        Contenuto incrementale del messaggio in questo chunk. Il client deve
        concatenare il campo content di ogni chunk per ricostruire il
        messaggio completo.
      properties:
        role:
          type: string
          enum:
            - assistant
          description: Present only in the first chunk of the stream
          examples:
            - assistant
        content:
          type: string
          nullable: true
          description: Incremental content fragment for this chunk
          examples:
            - Paris
        tool_calls:
          type: array
          description: >-
            Present when the model is calling one or more tools. Each field
            other than index arrives fragmented across multiple chunks and
            must be concatenated client-side.
          items:
            type: object
            required:
              - index
            properties:
              index:
                type: integer
                examples:
                  - 0
              id:
                type: string
                examples:
                  - call_abc123
              type:
                type: string
                enum:
                  - function
                examples:
                  - function
              function:
                type: object
                properties:
                  name:
                    type: string
                    examples:
                      - get_current_weather
                  arguments:
                    type: string
                    description: JSON string fragment, to be concatenated
                    examples:
                      - '{"location":'
    CompletionStreamResponse:
      type: object
      description: >-
        Rappresenta un singolo chunk inviato durante lo streaming di
        /v1/completions. Il campo choices contiene, per ciascun chunk, il
        frammento incrementale di testo generato.
      required:
        - id
        - object
        - created
        - model
        - choices
      properties:
        id:
          type: string
          description: A unique identifier for the completion
          examples:
            - cmpl-8f9a3b1c2d
        object:
          type: string
          enum:
            - text_completion
          description: The object type
          examples:
            - text_completion
        created:
          type: integer
          description: The Unix timestamp of when the completion was created
          examples:
            - 1717000000
        model:
          type: string
          description: The model used for completion
          examples:
            - gpt-oss-20b
        choices:
          type: array
          description: >-
            A list of completion choice deltas. Empty array in the final
            usage-only chunk when stream_options.include_usage is true.
          items:
            type: object
            required:
              - index
              - text
            properties:
              text:
                type: string
                description: Incremental text fragment for this chunk
                examples:
                  - Once
              index:
                type: integer
                examples:
                  - 0
              finish_reason:
                type: string
                nullable: true
                enum:
                  - stop
                  - length
                description: >-
                  The reason the model stopped generating tokens. Null in
                  every chunk except the last one for this choice.
                examples:
                  - null
          examples:
            - text: Once
              index: 0
              finish_reason:
        usage:
          type: object
          nullable: true
          description: >-
            Present only in the final chunk, and only if
            stream_options.include_usage was true in the request. In that
            chunk, choices is an empty array.
          properties:
            prompt_tokens:
              type: integer
              examples:
                - 5
            completion_tokens:
              type: integer
              examples:
                - 12
            total_tokens:
              type: integer
              examples:
                - 17
    CompletionRequest:
      type: object
      required:
        - model
        - prompt
      properties:
        model:
          type: string
          description: ID of the model to use
          examples:
            - gpt-oss-20b
        prompt:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          description: The prompt(s) to generate completions for
          examples:
            - 'Once upon a time,'
        best_of:
          type: integer
          nullable: true
          minimum: 1
          default: 1
          description: Generates multiple completions server-side and returns the best one.
          examples:
            - 1
        frequency_penalty:
          type: number
          nullable: true
          minimum: -2
          maximum: 2
          default: 0
          description: Penalizes tokens based on their existing frequency in the text so far.
          examples:
            - 0
        logit_bias:
          type: object
          nullable: true
          additionalProperties:
            type: integer
          description: Modify the likelihood of specified tokens appearing in the completion.
          examples:
            - "1234": -100
        logprobs:
          oneOf:
            - type: boolean
            - type: integer
              minimum: 0
            - type: 'null'
          description: Include log probabilities on the logprobs most likely output tokens.
          examples:
            - false
        max_tokens:
          type: integer
          nullable: true
          minimum: 1
          default: 16
          description: The maximum number of tokens to generate.
          examples:
            - 2048
        n:
          type: integer
          nullable: true
          minimum: 1
          default: 1
          description: How many completions to generate for each prompt.
          examples:
            - 1
        presence_penalty:
          type: number
          nullable: true
          minimum: -2
          maximum: 2
          default: 0
          description: Penalizes new tokens based on whether they appear in the text so far.
          examples:
            - 0
        seed:
          type: integer
          nullable: true
          format: int64
          description: Seed for deterministic sampling.
          examples:
            - 42
        stop:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
              maxItems: 4
            - type: 'null'
          examples:
