openapi: 3.1.0
info:
  title: AI Text Management API
  description: |
    AI Free-Text Assistant - 10 text-processing endpoints via LLM

    Use your Client ID and Client Secret to request an access token. The three parameters (grant_type, client_id, client_secret) go in the request body as x-www-form-urlencoded; the only header is Content-Type.

    
    curl -X POST https://mylogin.aruba.it/auth/realms/cmp-new-apikey-ai/protocol/openid-connect/token \
    -H "Content-Type: application/x-www-form-urlencoded" \
    -d "grant_type=client_credentials" \
    -d "client_id=<YOUR_CLIENT_ID>" \
    -d "client_secret=<YOUR_CLIENT_SECRET>"
    

    The response contains the token in the access_token field and its lifetime in expires_in (seconds) ready to be used in the Authorize section. When it expires, request a new one.
  version: 1.1.0
servers:
- url: https://apiaruba.it/textmanagement
security:
- bearerAuth: []
tags:
- name: Text Management API
  description: AI-assisted free-text processing endpoints
paths:
  "/v1/text/translate":
    post:
      tags:
      - Text Management API
      summary: Translate a text to a target language
      operationId: translate
      parameters:
      - name: Conversation-Id
        in: header
        required: false
        style: simple
        explode: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TextTranslateRequest"
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TextTranslateResponse"
        '400':
          description: Invalid or empty input content
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '499':
          description: 'Policy violation: the LLM has detected unauthorized content'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '502':
          description: Backend LLM unreachable
          content:
            application/json:
              schema:
