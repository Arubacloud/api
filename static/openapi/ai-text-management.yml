components:
  schemas:
    TextTranslateRequest:
      type: object
      properties:
        content:
          type: string
          minLength: 1
        language:
          type: string
          minLength: 1
      required:
      - content
      - language
    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
    AiPlatformUsage:
      type: object
      properties:
        service:
          type: string
        namespace:
          type: string
        prompt_tokens:
          type: integer
          format: int64
        completion_tokens:
          type: integer
          format: int64
        total_tokens:
          type: integer
          format: int64
    TextTranslateResponse:
      type: object
      properties:
        content:
          type: string
        ai_platform_usage:
          "$ref": "#/components/schemas/AiPlatformUsage"
        ai_generated:
          type: boolean
    TextSummarizeRequest:
      type: object
      properties:
