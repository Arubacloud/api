    ResponsesStreamResponse:
      description: >-
        Represents a single SSE event streamed from /v1/responses. The event's
        "type" field determines which additional fields are present. Text output
        is reconstructed by concatenating "delta" fields from
        response.reasoning_text.delta and response.output_text.delta events,
        grouped by item_id/content_index.
      oneOf:
        - $ref: '#/components/schemas/ResponsesStreamResponseCreated'
        - $ref: '#/components/schemas/ResponsesStreamInProgress'
        - $ref: '#/components/schemas/ResponsesStreamOutputItemAdded'
        - $ref: '#/components/schemas/ResponsesStreamReasoningPartAdded'
        - $ref: '#/components/schemas/ResponsesStreamReasoningTextDelta'
        - $ref: '#/components/schemas/ResponsesStreamReasoningTextDone'
        - $ref: '#/components/schemas/ResponsesStreamReasoningPartDone'
        - $ref: '#/components/schemas/ResponsesStreamOutputItemDone'
        - $ref: '#/components/schemas/ResponsesStreamContentPartAdded'
        - $ref: '#/components/schemas/ResponsesStreamOutputTextDelta'
        - $ref: '#/components/schemas/ResponsesStreamOutputTextDone'
        - $ref: '#/components/schemas/ResponsesStreamContentPartDone'
        - $ref: '#/components/schemas/ResponsesStreamCompleted'
      discriminator:
        propertyName: type
        mapping:
          response.created: '#/components/schemas/ResponsesStreamResponseCreated'
          response.in_progress: '#/components/schemas/ResponsesStreamInProgress'
          response.output_item.added: '#/components/schemas/ResponsesStreamOutputItemAdded'
          response.reasoning_part.added: '#/components/schemas/ResponsesStreamReasoningPartAdded'
          response.reasoning_text.delta: '#/components/schemas/ResponsesStreamReasoningTextDelta'
          response.reasoning_text.done: '#/components/schemas/ResponsesStreamReasoningTextDone'
          response.reasoning_part.done: '#/components/schemas/ResponsesStreamReasoningPartDone'
          response.output_item.done: '#/components/schemas/ResponsesStreamOutputItemDone'
          response.content_part.added: '#/components/schemas/ResponsesStreamContentPartAdded'
          response.output_text.delta: '#/components/schemas/ResponsesStreamOutputTextDelta'
          response.output_text.done: '#/components/schemas/ResponsesStreamOutputTextDone'
          response.content_part.done: '#/components/schemas/ResponsesStreamContentPartDone'
          response.completed: '#/components/schemas/ResponsesStreamCompleted'

    ResponsesStreamResponseCreated:
      type: object
      required: [type, response, sequence_number, model]
      properties:
        type:
          type: string
          enum: [response.created]
        response:
          $ref: '#/components/schemas/ResponsesResponse'
        sequence_number:
          type: integer
          examples: [0]
        model:
          type: string
          examples: [gpt-oss-20b]

    ResponsesStreamInProgress:
      type: object
      required: [type, response, sequence_number, model]
      properties:
        type:
          type: string
          enum: [response.in_progress]
        response:
