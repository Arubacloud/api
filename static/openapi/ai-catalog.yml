          nullable: true
          default: false
          description: Whether to stream back partial progress.
          examples:
            - false
        stream_options:
          type: object
          nullable: true
          additionalProperties: true
          description: Options for streaming responses.
          examples:
            - include_usage: true
        suffix:
          type: string
          nullable: true
          description: Suffix that comes after a completion of inserted text.
          examples:
            - ' the end.'
        temperature:
          type: number
          nullable: true
          minimum: 0
          maximum: 2
          default: 1
          description: Sampling temperature.
          examples:
            - 0.7
        top_p:
          type: number
          nullable: true
          minimum: 0
          maximum: 1
          default: 1
          description: Nucleus sampling parameter.
          examples:
            - 1
        user:
          type: string
          nullable: true
          description: Unique identifier representing the end user.
          examples:
            - user-1234
